<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="brand">{{ app_name }}</div>
        <nav class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('register') }}">Register</a>
        </nav>
    </header>

    <div class="auth-wrap">
        <div class="card auth-card">
            <h2 style="text-align:center;">Login to {{ app_name }}</h2>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Your username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Your password" required>
                </div>
                <div class="form-group" style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="remember" name="remember" style="width:auto;">
                    <label for="remember" style="margin:0;">Remember me on this computer</label>
                </div>
                <button type="submit" class="btn" style="width:100%;">Login</button>
            </form>

            <p style="text-align:center; margin-top:16px; color:var(--muted);">
                New here? <a href="{{ url_for('register') }}">Create an account</a>
            </p>
        </div>
    </div>

    <footer class="footer">
        <p>{{ app_name }} - Final Year B.Sc. IT Project</p>
    </footer>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
